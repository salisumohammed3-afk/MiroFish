[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - A concise and universal collective intelligence engine for predicting everything"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM related
    "openai>=1.0.0",
    
    # Knowledge graph: Graphiti as a library on a self-hosted FalkorDB
    # (pinned exactly; Graphiti changes behaviour between minor releases)
    "graphiti-core[anthropic,falkordb]==0.31.2",
    # Graphiti's Anthropic client sends temperature and forced tool use, which
    # the 0.x SDK line still sends with the older API version. Stay on 0.x.
    "anthropic>=0.49.0,<1",
    
    # OASIS social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports non-UTF-8 encoded text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Authentication & Database
    "supabase>=2.0.0",
    
    # Utility libraries
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # API keys: the /mcp endpoint for Claude and agents (the official MCP SDK,
    # held on 1.x because camel-ai already uses it)
    "mcp>=1.24.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# camel-oasis 0.2.5 pins neo4j==5.23.0 but graphiti-core needs neo4j>=5.26.
# OASIS only uses neo4j.GraphDatabase in an optional backend we never enable,
# and that API is unchanged across 5.x, so let Graphiti's floor win.
override-dependencies = ["neo4j>=5.26,<6"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
